name: C2C News Bot

on:
  schedule:
    - cron: '0 23 * * *'   # 한국 오전 8시 (UTC 23시)
  workflow_dispatch:

jobs:
  send-c2c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: C2C 뉴스봇 실행
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECV_ADDRESS:       ${{ secrets.RECV_ADDRESS }}
        run: python c2c_bot.py
